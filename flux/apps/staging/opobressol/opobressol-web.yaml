apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opobressol-web
  namespace: apps
spec:
  values:
    image:
      # Flux image automation replaces this with the newest timestamp tag
      full: cristianrb/opobressol-web:20261108164802-0549e0a # {"$imagepolicy": "flux-system:opobressol-web"}
      pullPolicy: IfNotPresent
    serviceAccount:
      automount: false
    # nginx serving static files: a few MB of memory.
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
    service:
      port: 8080
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging
      hosts:
        - host: opobressol.cat
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: opobressol-cat-tls
          hosts:
            - opobressol.cat
