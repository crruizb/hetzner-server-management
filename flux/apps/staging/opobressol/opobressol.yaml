apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opobressol-service
  namespace: apps
spec:
  values:
    image:
      full: cristianrb/opobressol-api:20261019062533-7f68cb6 # {"$imagepolicy": "flux-system:opobressol-service"}
      pullPolicy: Always
    envSecretName: opobressol-secrets
    # Small Go binary. Memory request = limit so the pod always gets it on this small node.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    service:
      port: 8080
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging
      hosts:
        - host: api.opobressol.cat
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: api-opobressol-cat-tls
          hosts:
            - api.opobressol.cat
