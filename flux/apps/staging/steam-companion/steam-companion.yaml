apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: steam-companion-service
  namespace: apps
spec:
  values:
    image:
      full: cristianrb/steamcompanion:20260929164902-c988e82 # {"$imagepolicy": "flux-system:steam-companion-service"}
      pullPolicy: Always
    envSecretName: steam-companion-secrets
    # The JVM sizes its heap from the memory limit (-XX:MaxRAMPercentage=50 in the image's
    # Dockerfile), so the heap gets 256Mi and the rest covers metaspace, threads, etc.
    # Memory request = limit, so the pod always gets its full memory on this small node.
    # No CPU limit: Spring Boot needs bursts of CPU while starting.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 512Mi
    service:
      port: 8080
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging
      hosts:
        - host: api.steamcompanion.dpdns.org
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: steamcompanion-dpdns-org-tls
          hosts:
            - api.steamcompanion.dpdns.org
