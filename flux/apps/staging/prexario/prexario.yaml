apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prexario-service
  namespace: apps
spec:
  values:
    image:
      repository: cristianrb/prexario
      tag: latest
      pullPolicy: Always
    envSecretName: prexario-secrets
    # JVM with no explicit heap cap: it sizes the heap from this limit, so without one it
    # could grow towards a quarter of the whole node. Usage is around 350Mi.
    # Memory request = limit so the pod always gets it on this small node. No CPU limit
    # so startup can burst.
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 512Mi
    service:
      port: 8080
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-staging
      hosts:
        - host: api.prexario.dpdns.org
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: prexario-dpdns-org-tls
          hosts:
            - api.prexario.dpdns.org
